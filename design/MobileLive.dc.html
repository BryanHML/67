<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; }
    a { color: #d63c14; } a:hover { color: #a82d0d; }
    .paper { background-color: #fffdf7; background-image: radial-gradient(#16141a08 1px, #0000 1px); background-size: 4px 4px; }
    .disp { font-family: 'Bricolage Grotesque', system-ui, sans-serif; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #101015; font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #16141a;">
  <div style="position: absolute; inset: 0; background: radial-gradient(110% 60% at 50% 26%, #2a2436 0%, #17151f 50%, #0e0d13 100%);"></div>
  <svg viewBox="0 0 390 844" style="position: absolute; inset: 0; width: 390px; height: 844px;" fill="none">
    <g stroke="#ffe14d" stroke-width="3.5" stroke-linecap="round" opacity="0.8">
      <path d="M150 330 L126 260 L116 214 L110 186"/><circle cx="110" cy="186" r="5.5" fill="#ffe14d" stroke="none"/>
      <path d="M150 330 L150 254 L149 202 L148 170"/><circle cx="148" cy="170" r="5.5" fill="#ffe14d" stroke="none"/>
      <path d="M150 330 L174 260 L182 216 L187 190"/><circle cx="187" cy="190" r="5.5" fill="#ffe14d" stroke="none"/>
      <path d="M150 330 L194 274 L210 240 L220 222"/><circle cx="220" cy="222" r="5.5" fill="#ffe14d" stroke="none"/>
      <path d="M150 330 L110 306 L80 290"/><circle cx="80" cy="290" r="5.5" fill="#ffe14d" stroke="none"/>
      <path d="M126 260 L150 254 L174 260 L194 274"/>
    </g>
  </svg>

  <div style="position: absolute; top: 0; left: 0; right: 0; padding: 52px 16px 0; display: flex; justify-content: space-between; align-items: center; gap: 12px;">
    <div style="display: flex; align-items: center; gap: 9px; background: #ffe14d; border: 2px solid #16141a; border-radius: 999px; padding: 9px 16px;">
      <span style="width: 8px; height: 8px; border-radius: 50%; background: #d63c14;"></span>
      <span class="disp" style="font-weight: 800; font-size: 16px;">67</span>
    </div>
    <button style="display: grid; place-items: center; width: 44px; height: 44px; background: #fffdf7; border: 2px solid #16141a; border-radius: 999px; cursor: pointer;"><svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="#16141a" stroke-width="2.2" stroke-linecap="round"><path d="M7.5 7.2a2.6 2.6 0 1 1 3.2 2.6c-.5.2-.7.6-.7 1.1v.6"/><path d="M10 14.6v.5"/></svg></button>
  </div>

  <!-- Stacked: the 300x300 slot sits above its label, full card width. -->
  <div style="position: absolute; left: 16px; right: 16px; bottom: 100px;">
    <div class="paper" style="border: 2px solid #16141a; border-radius: 20px; padding: 14px; box-shadow: 4px 4px 0 #16141a; display: flex; flex-direction: column; gap: 12px;">
      <div style="display: grid; place-items: center; width: 100%; height: 300px; background: #ffe14d; border: 2px solid #16141a; border-radius: 14px;"><svg viewBox="0 0 120 120" width="190" height="190" fill="none" stroke="#16141a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M28 46 24 20l22 14"/><path d="M92 46 96 20 74 34"/>
        <path d="M60 30c19 0 34 14 34 33S79 98 60 98 26 82 26 63s15-33 34-33Z"/>
        <path d="M47 58v5M73 58v5"/><path d="M55 76c3 3 7 3 10 0"/>
        <path d="M18 66h16M86 66h16M20 76l14-4M86 72l14 4"/>
      </svg></div>
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px;">
        <span class="disp" style="font-weight: 800; font-size: 23px; line-height: 1; letter-spacing: -0.02em;">dancing cat</span>
        <span style="font-size: 10.5px; font-weight: 600; letter-spacing: 0.06em; color: #fffdf7; background: #d63c14; border-radius: 999px; padding: 4px 10px; white-space: nowrap;">MOVE &#8597;</span>
      </div>
    </div>
  </div>

  <div style="position: absolute; left: 16px; right: 16px; bottom: 26px; display: flex; gap: 8px;"><span style="display: grid; place-items: center; flex-grow: 1; height: 52px; border-radius: 14px; background: #ffe14d; border: 2px solid #16141a;"><svg viewBox="0 0 26 26" width="26" height="26" fill="none" stroke="#16141a" stroke-width="2" stroke-linecap="round"><rect x="5.5" y="14" width="13" height="9.5" rx="3.5"/><path d="M8 14V5"/><path d="M11.5 14v-2"/><path d="M15 14v-2"/><path d="M18 14v-2"/><path d="M5.5 17 3.5 15.8"/></svg></span><span style="display: grid; place-items: center; flex-grow: 1; height: 52px; border-radius: 14px; background: #ff7a4d; border: 2px solid #16141a;"><svg viewBox="0 0 26 26" width="26" height="26" fill="none" stroke="#16141a" stroke-width="2" stroke-linecap="round"><rect x="5.5" y="14" width="13" height="9.5" rx="3.5"/><path d="M8 14V5"/><path d="M11.5 14V3.5"/><path d="M15 14V5"/><path d="M18 14V7"/><path d="M5.5 17 2.8 15"/></svg></span><span style="display: grid; place-items: center; flex-grow: 1; height: 52px; border-radius: 14px; background: #ff7a4d; border: 2px solid #16141a;"><svg viewBox="0 0 26 26" width="26" height="26" fill="none" stroke="#16141a" stroke-width="2" stroke-linecap="round"><rect x="5.5" y="14" width="13" height="9.5" rx="3.5"/><path d="M8 14v-2"/><path d="M11.5 14v-2"/><path d="M15 14v-2"/><path d="M18 14v-2"/><path d="M5.5 17 3.5 15.8"/></svg></span><span style="display: grid; place-items: center; flex-grow: 1; height: 52px; border-radius: 14px; background: #ff7a4d; border: 2px solid #16141a;"><svg viewBox="0 0 26 26" width="26" height="26" fill="none" stroke="#16141a" stroke-width="2" stroke-linecap="round"><rect x="5.5" y="14" width="13" height="9.5" rx="3.5"/><path d="M8 14V5"/><path d="M11.5 14V3.5"/><path d="M15 14V5"/><path d="M18 14V7"/><path d="M5.5 17 2.8 15"/></svg></span></div>
</div>
</x-dc>
</body>
</html>
